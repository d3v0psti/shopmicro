services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Defina POSTGRES_DB no arquivo infra/.env}"
      POSTGRES_USER: "${POSTGRES_USER:?Defina POSTGRES_USER no arquivo infra/.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo infra/.env}"
    ports:
      - "${POSTGRES_HOST_PORT:?Defina POSTGRES_HOST_PORT no arquivo infra/.env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  shopmicro-backend:
    build:
      context: ../shopmicro-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:?Defina ASPNETCORE_ENVIRONMENT no arquivo infra/.env}"
      DB_CONNECTION_STRING: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET:?Defina JWT_SECRET no arquivo infra/.env}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?Defina CORS_ALLOWED_ORIGINS no arquivo infra/.env}"
      ENABLE_SWAGGER: "${ENABLE_SWAGGER:?Defina ENABLE_SWAGGER no arquivo infra/.env}"
      STORAGE_PROVIDER: "${STORAGE_PROVIDER:?Defina STORAGE_PROVIDER no arquivo infra/.env}"
      ADMIN_BOOTSTRAP_EMAIL: "${ADMIN_BOOTSTRAP_EMAIL:?Defina ADMIN_BOOTSTRAP_EMAIL no arquivo infra/.env}"
      ADMIN_BOOTSTRAP_PASSWORD: "${ADMIN_BOOTSTRAP_PASSWORD:?Defina ADMIN_BOOTSTRAP_PASSWORD no arquivo infra/.env}"
      ADMIN_BOOTSTRAP_FULL_NAME: "${ADMIN_BOOTSTRAP_FULL_NAME:?Defina ADMIN_BOOTSTRAP_FULL_NAME no arquivo infra/.env}"
    ports:
      - "${BACKEND_HOST_PORT:?Defina BACKEND_HOST_PORT no arquivo infra/.env}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - shopmicro_backend_uploads:/app/uploads

  shopmicro-frontend:
    build:
      context: ../shopmicro-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: "${BACKEND_UPSTREAM:?Defina BACKEND_UPSTREAM no arquivo infra/.env}"
    ports:
      - "${MARKETPLACE_HOST_PORT:?Defina MARKETPLACE_HOST_PORT no arquivo infra/.env}:80"
    depends_on:
      shopmicro-backend:
        condition: service_started

  shopmicro-frontend-admin:
    build:
      context: ../shopmicro-frontend-admin
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: "${BACKEND_UPSTREAM:?Defina BACKEND_UPSTREAM no arquivo infra/.env}"
    ports:
      - "${ADMIN_HOST_PORT:?Defina ADMIN_HOST_PORT no arquivo infra/.env}:80"
    depends_on:
      shopmicro-backend:
        condition: service_started

volumes:
  postgres_data:
  shopmicro_backend_uploads:
