services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped

    environment:
      DB_CONNECTION_STRING: "Host=${DB_HOST};Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};SSL Mode=VerifyFull;Root Certificate=/app/global-bundle.pem"

      CORS_ALLOWED_ORIGINS: "*"
      ENABLE_SWAGGER: "true"

    volumes:
      - ./global-bundle.pem:/app/global-bundle.pem:ro

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend