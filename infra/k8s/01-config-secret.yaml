apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: shopmicro
data:
  POSTGRES_DB: "shopdb"
  BACKEND_UPSTREAM: "http://backend-service:8080"
  CORS_ALLOWED_ORIGINS: "*"
  ENABLE_SWAGGER: "false"
---
# Em produção real, NUNCA versione o Secret em texto puro.
# Use um cofre de segredos (Vault, AWS Secrets Manager, Azure Key Vault,
# GCP Secret Manager, ou Sealed Secrets/SOPS para on-premises) e injete
# via CI/CD ou operador externo. Este arquivo serve apenas de exemplo local.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: shopmicro
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  DB_CONNECTION_STRING: "Host=postgres-service;Port=5432;Database=shopdb;Username=postgres;Password=postgres"
