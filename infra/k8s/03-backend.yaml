apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shopmicro
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Substitua pela imagem publicada no seu registry
          # (Docker Hub, ECR, ACR, GCR, GitHub Container Registry, Harbor on-prem, etc)
          image: your-registry/backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_CONNECTION_STRING
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CORS_ALLOWED_ORIGINS
            - name: ENABLE_SWAGGER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ENABLE_SWAGGER
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: shopmicro
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
